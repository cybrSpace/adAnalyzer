name: PowerShell regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Regression tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated regression tests
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoLogo -NoProfile -NonInteractive -File ./tests/Invoke-RegressionTests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
